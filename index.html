<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#123c2b">
<title>Pulicat Lake | Connect With Us</title>
<style>
:root{color-scheme:light;--green:#123c2b;--leaf:#1d6b49;--ink:#172536;--muted:#607166}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(160deg,#eaf6f1,#f7fbff 55%,#edf5e9);color:var(--ink);display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);background:#fff;border:1px solid #dce9df;border-radius:26px;padding:30px 24px;box-shadow:0 18px 50px #123c2b18;text-align:center}
.logo{width:76px;height:76px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#e6f3eb;color:var(--green);font-size:34px}
.tag{display:inline-block;background:#e8f3eb;color:var(--leaf);font-size:11px;font-weight:800;letter-spacing:2px;padding:7px 12px;border-radius:99px}
h1{font-size:30px;letter-spacing:1px;margin:14px 0 8px;color:var(--green)}
p{margin:0 auto 24px;line-height:1.55;color:var(--muted);font-size:14px}
.links{display:grid;gap:12px}
a{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;padding:16px 18px;border-radius:14px;background:var(--green);color:white;font-weight:700;font-size:16px;transition:transform .15s,background .15s}
a:hover{background:var(--leaf);transform:translateY(-1px)}
a.form{background:#e7f3ea;color:var(--green);border:1px solid #c9dfce}
footer{margin-top:24px;font-size:11px;letter-spacing:1.4px;color:#718477;font-weight:700}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">🌿</div>
  <span class="tag">CONNECT WITH US</span>
  <h1>PULICAT LAKE</h1>
  <p>Let's restore. Let's protect. Let's revive Pulicat Lake.<br>Choose a link below to connect with us.</p>
  <nav class="links" aria-label="Pulicat Lake links">
    <a href="https://x.com/Pulicat_Lake?s=20" target="_blank" rel="noopener noreferrer">𝕏 &nbsp; Follow us on X</a>
    <a href="https://www.instagram.com/restore_pulicat_lake" target="_blank" rel="noopener noreferrer">◎ &nbsp; Follow us on Instagram</a>
    <a href="https://www.linkedin.com/in/pulicat-lake/" target="_blank" rel="noopener noreferrer">in &nbsp; Connect on LinkedIn</a>
    <a class="form" href="https://forms.gle/95FAKpTVQhPTvUKPA" target="_blank" rel="noopener noreferrer">📝 &nbsp; Webinar Registration</a>
  </nav>
  <footer>LET'S RESTORE • PROTECT • REVIVE</footer>
</main>
</body>
</html>
